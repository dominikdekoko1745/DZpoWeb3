<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система заселения</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Система заселения в общежитие</h1>

    <p class="description">
        Заполните данные для проверки возможности заселения.
    </p>

    <form id="checkForm">

        <label for="studentId">ID студента</label>
        <input
            type="number"
            id="studentId"
            placeholder="Например: 1"
            min="1"
            required
        >

        <label for="buildingNumber">Номер корпуса</label>
        <input
            type="number"
            id="buildingNumber"
            placeholder="Например: 2"
            min="1"
            required
        >

        <label for="roomNumber">Номер комнаты</label>
        <input
            type="number"
            id="roomNumber"
            placeholder="Например: 102"
            min="1"
            required
        >

        <button type="submit">
            Проверить
        </button>

    </form>

    <div id="result" class="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
